# Loaded only by the test-runtime launcher; never packaged in the application.
server.address=127.0.0.1
server.port=18080
management.server.address=127.0.0.1
management.server.port=0
spring.datasource.url=jdbc:h2:mem:nexus_e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false
spring.sql.init.mode=always

# Keep browser runs isolated from any locally running Kafka or Redis service.
spring.kafka.bootstrap-servers=127.0.0.1:1
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
spring.data.redis.connect-timeout=100ms
spring.data.redis.timeout=100ms

app.seed-demo-data=true
app.bootstrap.admin-email=admin@example.test
app.bootstrap.admin-name=E2E Administrator
app.bootstrap.admin-password=${E2E_ADMIN_PASSWORD}
app.bootstrap.staff-password=${E2E_STAFF_PASSWORD}
jwt.secret=${E2E_JWT_SECRET}
jwt.expiration=3600000
# Repeated successful UI logins across three engines share the loopback client.
app.login.max-attempts-per-minute=300
app.cors.allowed-origins=http://127.0.0.1:4173
logging.level.org.springframework.boot.security=ERROR
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
