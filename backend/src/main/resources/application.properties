spring.application.name=nexus-supply-chain
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/supply_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:enterprise_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# ---- HikariCP Connection Pool Tuning ----
spring.datasource.hikari.maximum-pool-size=64
spring.datasource.hikari.minimum-idle=16
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ---- JPA / Hibernate Performance ----
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=nexus-supply-chain-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Logging Configurations
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.root=INFO

# JWT configuration keys
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.max-active=64
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=8
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.cache.type=redis

# ---- Actuator & Prometheus Configuration ----
management.server.port=${MANAGEMENT_SERVER_PORT:9091}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ---- Tomcat Server Performance Tuning ----
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000


# Bootstrap creates an admin only on an empty user table when both credentials are supplied.
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${APP_BOOTSTRAP_ADMIN_NAME:Administrator}
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
app.bootstrap.staff-password=${APP_BOOTSTRAP_STAFF_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
# Do not reinterpret a caller-controlled forwarding header as the client address.
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Per application instance; use a shared trusted gateway limit for a multi-instance deployment.
app.login.max-attempts-per-minute=${APP_LOGIN_MAX_ATTEMPTS_PER_MINUTE:30}
app.login.max-tracked-clients=${APP_LOGIN_MAX_TRACKED_CLIENTS:10000}

# Compose requires Kafka; local development may intentionally use fallback delivery.
app.events.kafka-required=${APP_EVENTS_KAFKA_REQUIRED:false}
app.events.kafka-startup-timeout-ms=${APP_EVENTS_KAFKA_STARTUP_TIMEOUT_MS:10000}
# Read messages only; unread notifications are retained. Set 0 to disable pruning.
app.notifications.read-retention-days=${APP_NOTIFICATIONS_READ_RETENTION_DAYS:30}
