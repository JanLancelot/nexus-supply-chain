management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_MONITORING_ENVIRONMENT:local}
# Publish bounded HTTP latency buckets for aggregatable p95/p99 and SLO dashboards.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s

# Runtime link for administrators; Grafana maintains its own authentication.
app.monitoring.grafana-url=${APP_MONITORING_GRAFANA_URL:}
# Aggregate DB queries and dependency probes run in background, never during scrapes.
app.monitoring.snapshot-interval-ms=${APP_MONITORING_SNAPSHOT_INTERVAL_MS:30000}
app.monitoring.metrics-enabled=${APP_MONITORING_METRICS_ENABLED:true}
