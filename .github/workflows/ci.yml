name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [backend, containers]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run backend tests
        run: ./bin/verify.sh ${{ matrix.mode }}

      - name: Save backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.mode }}-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        run: ./bin/verify.sh frontend

      - name: Save frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  deploy-to-staging:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required only for Azure deployment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: pgsupplyregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Consolidated Docker Image
        run: |
          docker build -t pgsupplyregistry.azurecr.io/backend:${{ github.sha }} -t pgsupplyregistry.azurecr.io/backend:latest -f backend/Dockerfile .
          docker push pgsupplyregistry.azurecr.io/backend:${{ github.sha }}
          docker push pgsupplyregistry.azurecr.io/backend:latest

      - name: Deploy Consolidated App to Azure App Service (Staging Slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pg-enterprise-supply-api'
          slot-name: 'staging'
          images: 'pgsupplyregistry.azurecr.io/backend:${{ github.sha }}'
