name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [backend, containers]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven distribution
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-${{ runner.arch }}-maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Prepare Maven wrapper
        timeout-minutes: 3
        run: ./bin/prepare-maven.sh

      - name: Build and run backend tests
        run: ./bin/verify.sh ${{ matrix.mode }}

      - name: Save backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.mode }}-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Verify frontend
        run: ./bin/verify.sh frontend

      - name: Save frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache Maven distribution
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-${{ runner.arch }}-maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Prepare Maven wrapper
        timeout-minutes: 3
        run: ./bin/prepare-maven.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify browser workflows
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Save browser reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            frontend/playwright-report/e2e/
            frontend/test-results/e2e/
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare canonical browser screenshots
        run: ./bin/verify.sh visual
      - name: Save visual report, traces, and image diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regressions
          path: |
            frontend/playwright-report/visual/
            frontend/test-results/visual/
          retention-days: 14

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify benchmark tooling
        run: python3 -m unittest discover -s load-tests -p 'test_*.py'
      - name: Verify benchmark order fixtures
        run: node --test load-tests/lib/order-fixtures.test.mjs
      - name: Verify disposable test launcher and cloud script guards
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.6'
      - name: Verify infrastructure without cloud access
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform test
      - name: Check harness shell syntax
        run: bash -n bin/backup-grafana.sh docker/grafana/start.sh bin/verify.sh bin/verify-monitoring.sh bin/start-e2e-backend.sh bin/prepare-maven.sh bin/visual-tests.sh bin/resume.sh bin/suspend.sh

  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify monitoring rules and real application telemetry
        run: ./bin/verify.sh monitoring

  deploy-to-staging:
    needs: [backend, frontend, e2e, visual, tooling, monitoring]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY || 'nexussupplyregistry' }}
    permissions:
      contents: read
      id-token: write # Required only for Azure deployment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build and Push Consolidated Docker Image
        run: |
          docker build -t "$AZURE_CONTAINER_REGISTRY.azurecr.io/backend:${{ github.sha }}" -f backend/Dockerfile .
          docker push "$AZURE_CONTAINER_REGISTRY.azurecr.io/backend:${{ github.sha }}"

      - name: Deploy Consolidated App to Azure App Service (Staging Slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'nexus-supply-api' }}
          slot-name: 'staging'
          images: '${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/backend:${{ github.sha }}'
