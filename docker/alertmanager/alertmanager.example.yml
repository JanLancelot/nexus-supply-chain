# Copy to a private ALERTMANAGER_CONFIG_DIR/alertmanager.yml and configure BOTH URL files.
# operator-webhook-url must accept Alertmanager's JSON webhook payload (not a raw Slack URL).
global:
  resolve_timeout: 5m
route:
  receiver: operators
  group_by: [alertname, job, instance, environment, component, dependency]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: external-watchdog
      matchers: ['alertname="NexusWatchdog"']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
receivers:
  - name: operators
    webhook_configs:
      - url_file: /etc/alertmanager/operator-webhook-url
        send_resolved: true
        max_alerts: 20
        timeout: 10s
        http_config:
          follow_redirects: false
  - name: external-watchdog
    webhook_configs:
      - url_file: /etc/alertmanager/watchdog-webhook-url
        send_resolved: false
        max_alerts: 1
        timeout: 10s
        http_config:
          follow_redirects: false
inhibit_rules:
  - source_matchers: ['alertname="NexusBackendDown"']
    target_matchers: ['alertname=~"NexusSnapshotFailed|NexusSnapshotStale|NexusDependencyDegraded"']
    equal: [job, instance]
