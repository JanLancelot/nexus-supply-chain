# Generated by configure-alerting.py --email. STARTTLS and certificate verification stay enabled.
# Detailed alerts go directly to your mailbox; Better Stack receives only watchdog heartbeats.
global:
  resolve_timeout: 5m
route:
  receiver: operators
  group_by: [alertname, job, instance, environment, component, dependency]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: external-watchdog
      matchers: ['alertname="NexusWatchdog"']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
receivers:
  - name: operators
    email_configs:
      - to: __RECIPIENT__
        from: __SENDER__
        smarthost: __SMTP_HOST__
        auth_username: __SMTP_USERNAME__
        auth_password_file: /etc/alertmanager/smtp-password
        require_tls: true
        send_resolved: true
  - name: external-watchdog
    webhook_configs:
      - url_file: /etc/alertmanager/watchdog-webhook-url
        send_resolved: false
        max_alerts: 1
        timeout: 10s
        http_config:
          follow_redirects: false
inhibit_rules:
  - source_matchers: ['alertname="NexusBackendDown"']
    target_matchers: ['alertname=~"NexusSnapshotFailed|NexusSnapshotStale|NexusDependencyDegraded"']
    equal: [job, instance]
