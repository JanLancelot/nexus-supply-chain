global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/nexus.yml

# Local Alertmanager is the default target; production requires receiver configuration.
alerting:
  alertmanagers:
    - api_version: v2
      file_sd_configs:
        - files:
            - /etc/prometheus/alertmanagers.json
          refresh_interval: 1m

scrape_configs:
  - job_name: 'spring-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:9091']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
