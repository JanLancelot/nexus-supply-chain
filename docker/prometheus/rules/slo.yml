      slo: order-availability
  - record: nexus:slo_source_present
    expr: (count by (job, application, environment) ((sum by (job, instance, application, environment) (http_server_requests_seconds_count{job="spring-backend",uri="/api/v1/inventory/products",method="GET",status=~"2..|429|5.."})
      and sum by (job, instance, application, environment) (http_server_requests_seconds_bucket{job="spring-backend",uri="/api/v1/inventory/products",method="GET",status=~"2..|429|5..",le="0.5"}))
