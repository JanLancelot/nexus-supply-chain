      slo: inventory-latency
  - record: nexus:slo_sample_valid
    expr: (nexus:slo_requests:increase5m >= bool 0) * (nexus:slo_bad:increase5m >= bool 0) * on (job) group_left () (min by
      (job) (up{job="spring-backend"}) == bool 1) * nexus:slo_source_present
  - record: nexus:slo_burn:ratio5m
    expr: nexus:slo_bad:ratio5m / (1 - nexus:slo_objective)
  - record: nexus:slo_burn:ratio30m
    expr: nexus:slo_bad:ratio30m / (1 - nexus:slo_objective)
  - record: nexus:slo_burn:ratio1h
    expr: nexus:slo_bad:ratio1h / (1 - nexus:slo_objective)
  - record: nexus:slo_burn:ratio6h
    expr: nexus:slo_bad:ratio6h / (1 - nexus:slo_objective)
