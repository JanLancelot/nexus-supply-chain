- name: nexus-slo-alerts
  interval: 1m
  rules:
  - alert: NexusSloFastBurn
    expr: (nexus:slo_burn:ratio1h > 14.4) and (nexus:slo_burn:ratio5m > 14.4) and (nexus:slo_requests:increase5m >= 100) and
      (nexus:slo_sample_valid == 1)
    labels:
      severity: critical
    annotations:
      summary: Service objective error budget is burning too quickly
      description: The {{ $labels.slo }} objective exceeds 14.4x burn in both 1h and 5m. Inspect eligible traffic and dependency
        health; this measures completed API responses, not external reachability.
      runbook_url: https://github.com/JanLancelot/nexus-supply-chain/blob/main/docs/runbooks/slo-burn.md
  - alert: NexusSloSustainedBurn
    expr: (nexus:slo_burn:ratio6h > 6) and (nexus:slo_burn:ratio30m > 6) and (nexus:slo_requests:increase30m >= 100) and (nexus:slo_sample_valid
      == 1)
    labels:
      severity: warning
    annotations:
      summary: Service objective error budget is burning too quickly
      description: The {{ $labels.slo }} objective exceeds 6x burn in both 6h and 30m. Inspect eligible traffic and dependency
        health; this measures completed API responses, not external reachability.
      runbook_url: https://github.com/JanLancelot/nexus-supply-chain/blob/main/docs/runbooks/slo-burn.md
