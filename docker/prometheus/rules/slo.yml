    expr: (count by (job, application, environment) ((sum by (job, instance, application, environment) (http_server_requests_seconds_count{job="spring-backend",uri="/api/v1/inventory/products",method="GET",status=~"2..|429|5.."}))
      >= bool 0) == on (job) group_left () count by (job) (up{job="spring-backend"})) > bool 0
    labels:
      slo: inventory-availability
  - record: nexus:slo_source_present
    expr: (count by (job, application, environment) ((sum by (job, instance, application, environment) (http_server_requests_seconds_count{job="spring-backend",uri="/api/v1/orders",method="POST",status=~"2..|429|5.."}))
      >= bool 0) == on (job) group_left () count by (job) (up{job="spring-backend"})) > bool 0
