groups:
- name: nexus-slos
  interval: 1m
  rules:
  - record: nexus:slo_requests:increase5m
    expr: sum by (job, application, environment) (increase(http_server_requests_seconds_count{job="spring-backend",uri="/api/v1/inventory/products",method="GET",status=~"2..|429|5.."}[5m]))
    labels:
      slo: inventory-availability
  - record: nexus:slo_bad:increase5m
    expr: clamp_min((sum by (job, application, environment) (increase(http_server_requests_seconds_count{job="spring-backend",uri="/api/v1/inventory/products",method="GET",status=~"2..|429|5.."}[5m])))
      - ((sum by (job, application, environment) (increase(http_server_requests_seconds_count{job="spring-backend",uri="/api/v1/inventory/products",method="GET",status=~"2.."}[5m])))
      or (0 * (sum by (job, application, environment) (increase(http_server_requests_seconds_count{job="spring-backend",uri="/api/v1/inventory/products",method="GET",status=~"2..|429|5.."}[5m]))))),
      0)
    labels:
      slo: inventory-availability
  - record: nexus:slo_bad:ratio5m
    expr: nexus:slo_bad:increase5m{slo="inventory-availability"} / (nexus:slo_requests:increase5m{slo="inventory-availability"}
      > 0)
    labels:
      slo: inventory-availability
  - record: nexus:slo_requests:increase30m
