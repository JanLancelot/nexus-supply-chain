rule_files:
- ../rules/slo-coverage.yml
evaluation_interval: 15m
tests:
- name: complete minute observations
  interval: 1m
  input_series:
  - series: nexus:slo_sample_valid{job="spring-backend",application="nexus-supply-chain",environment="test",slo="inventory-availability"}
    values: 1+0x15
  promql_expr_test:
  - expr: nexus:slo_valid_minutes:count15m * 1
    eval_time: 15m
    exp_samples:
    - labels: '{job="spring-backend",application="nexus-supply-chain",environment="test",slo="inventory-availability"}'
      value: 15
- name: missing one minute
  interval: 1m
  input_series:
  - series: nexus:slo_sample_valid{job="spring-backend",application="nexus-supply-chain",environment="test",slo="inventory-availability"}
    values: 1+0x6 _ 1+0x7
  promql_expr_test:
  - expr: nexus:slo_valid_minutes:count15m * 1
    eval_time: 15m
    exp_samples:
    - labels: '{job="spring-backend",application="nexus-supply-chain",environment="test",slo="inventory-availability"}'
      value: 14
- name: failed scrape minute
  interval: 1m
  input_series:
  - series: nexus:slo_sample_valid{job="spring-backend",application="nexus-supply-chain",environment="test",slo="inventory-availability"}
    values: 1+0x6 0 1+0x7
  promql_expr_test:
  - expr: nexus:slo_valid_minutes:count15m * 1
    eval_time: 15m
    exp_samples:
    - labels: '{job="spring-backend",application="nexus-supply-chain",environment="test",slo="inventory-availability"}'
      value: 14
