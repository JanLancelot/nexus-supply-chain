name: nexus-supply-chain

services:
  db:
    image: postgres:15-alpine
    container_name: pg_enterprise_supply
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: supply_db
      POSTGRES_USER: enterprise_admin
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_enterprise_supply
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  pg_data:
