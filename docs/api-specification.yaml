openapi: 3.0.3
info:
  title: Nexus Supply Chain API
  version: 1.0.0
  description: Inventory, purchase orders, user administration, notifications, and audit records. Bearer
    authentication is required unless an operation declares otherwise. Endpoint roles are documented per
    operation; there is no per-warehouse tenancy model.
servers:
- url: http://localhost:8080/api/v1
  description: Local development
security:
- BearerAuth: []
paths:
  /monitoring:
    get:
      summary: Read administrator monitoring configuration
      description: Administrators only. Returns the runtime Grafana link, with separate Grafana authentication.
        Missing or invalid configuration returns enabled false and a null URL. Metrics are available only
        on the private management listener, never through this API.
      operationId: getMonitoring
      responses:
        '200':
          description: Monitoring configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /auth/login:
    post:
      summary: Sign in
      description: Public endpoint. Requires an active account and valid credentials. Unknown accounts,
        incorrect passwords, and disabled accounts receive the same authentication error. Rate limiting
        defaults to 30 attempts per minute per socket-peer IP and process; users behind a proxy share
        its limit.
      operationId: postAuthLogin
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          description: Login attempt limit reached or the client counter table is full. Retry after the
            stated interval.
          headers:
            Retry-After:
              description: Seconds until another attempt may be made.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /inventory/products:
    get:
      summary: List products
      description: Staff and administrators. Returns a slice of at most 50 products, ordered by stable
        product UUID. Filters apply before pagination; no total count is calculated.
      operationId: getInventoryProducts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: search
        in: query
        description: Literal case-insensitive substring of SKU or name.
        schema:
          type: string
          maxLength: 255
      - name: warehouseId
        in: query
        description: Only products assigned to this warehouse.
        schema:
          type: string
          format: uuid
      - name: active
        in: query
        description: Filter by product active state; omitted includes both.
        schema:
          type: boolean
    post:
      summary: Create a product
      description: Administrators only. Initial stock is zero.
      operationId: postInventoryProducts
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
  /inventory/products/{id}/adjust:
    post:
      summary: Adjust product stock
      description: Administrators only. Applies a signed change and stores the before/after counts and
        reasonCode in the same transaction. Rejects stock underflow or overflow.
      operationId: postInventoryProductsIdAdjust
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAdjustRequest'
      parameters:
      - $ref: '#/components/parameters/Id'
  /orders:
    get:
      summary: List orders
      description: Staff and administrators can view orders across the shared workspace. Newest first;
        at most 50 per page.
      operationId: getOrders
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
    post:
      summary: Create a purchase order
      description: Staff and administrators. Creates a DRAFT using product prices from the database. Every
        product must be active and assigned to the destination warehouse.
      operationId: postOrders
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
  /orders/{id}:
    get:
      summary: Get an order
      description: Staff and administrators.
      operationId: getOrdersId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - $ref: '#/components/parameters/Id'
  /orders/{id}/status:
    put:
      summary: Update an order status
      description: Staff and administrators. Forward transitions are DRAFT → PENDING_APPROVAL → APPROVED
        → SHIPPED → DELIVERED; any nonterminal state can transition to CANCELLED. Only administrators
        can move to APPROVED, SHIPPED, or DELIVERED. Staff can submit drafts or cancel orders only while
        DRAFT or PENDING_APPROVAL. Repeating the current status changes nothing. Delivery adds stock exactly
        once.
      operationId: putOrdersIdStatus
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      parameters:
      - $ref: '#/components/parameters/Id'
  /categories:
    get:
      summary: List categories
      description: Staff and administrators.
      operationId: getCategories
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    post:
      summary: Create a category
      description: Administrators only.
      operationId: postCategories
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
  /categories/{id}:
    get:
      summary: Get a category
      description: Staff and administrators.
      operationId: getCategoriesId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Update a category
      description: Administrators only. Replaces the editable fields; omitted optional fields become null.
      operationId: putCategoriesId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Delete a category
      description: Administrators only. Database references may prevent deletion.
      operationId: deleteCategoriesId
      responses:
        '204':
          description: Successful response
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - $ref: '#/components/parameters/Id'
  /warehouses:
    get:
      summary: List warehouses
      description: Staff and administrators.
      operationId: getWarehouses
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Warehouse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    post:
      summary: Create a warehouse
      description: Administrators only.
      operationId: postWarehouses
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
  /warehouses/{id}:
    get:
      summary: Get a warehouse
      description: Staff and administrators.
      operationId: getWarehousesId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Update a warehouse
      description: Administrators only. Replaces the editable fields; omitted optional fields become null.
      operationId: putWarehousesId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
      parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Delete a warehouse
      description: Administrators only. Database references may prevent deletion.
      operationId: deleteWarehousesId
      responses:
        '204':
          description: Successful response
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - $ref: '#/components/parameters/Id'
  /suppliers:
    get:
      summary: List suppliers
      description: Staff and administrators. Includes active and inactive suppliers.
      operationId: getSuppliers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    post:
      summary: Create a supplier
      description: Administrators only. Creates a named supplier and optionally assigns existing products.
        No external supplier connection is made.
      operationId: postSuppliers
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
  /users:
    get:
      summary: List users
      description: Administrators only. Password hashes are excluded.
      operationId: getUsers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    post:
      summary: Create a user
      description: Administrators only. Creates an ACTIVE account with the selected role.
      operationId: postUsers
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
  /audit-logs:
    get:
      summary: List audit logs
      description: Administrators only. Returns a plain array for one page, newest first, with at most
        50 entries. This endpoint provides no total count or hasNext field.
      operationId: getAudit-logs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
  /notifications:
    get:
      summary: List notifications
      description: Staff and administrators. Returns the current user’s latest 50 notifications plus counts
        across that user’s retained notifications.
      operationId: getNotifications
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /notifications/{id}/read:
    put:
      summary: Mark a notification as read
      description: Only the user who owns the notification can mark it as read.
      operationId: putNotificationsIdRead
      responses:
        '200':
          description: Successful response
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - $ref: '#/components/parameters/Id'
  /notifications/read-all:
    put:
      summary: Mark all notifications as read
      description: Staff and administrators. Updates only the current user’s notifications.
      operationId: putNotificationsRead-all
      responses:
        '200':
          description: Successful response
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /analytics/dashboard:
    get:
      summary: Get dashboard metrics
      description: Administrators only. Includes delivered purchase order value, stock value, low-stock
        counts, order status counts, warehouse units, and most ordered products.
      operationId: getAnalyticsDashboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboard'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/health:
    get:
      summary: Check application and database health
      description: Public bounded dependency check. HTTP 503 means database failure or required Kafka
        unavailable. Optional event fallback/cache bypass is reported as DEGRADED with HTTP 200.
      operationId: getApiHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database or required event dependency check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
    servers:
    - url: http://localhost:8080
      description: Health endpoint is outside /api/v1.
  /suppliers/{id}/products:
    get:
      summary: List supplier product assignments
      description: Staff and administrators.
      operationId: getSupplierProducts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProducts'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Replace supplier product assignments
      description: Administrators only. Replaces the whole assignment set atomically, records an audit
        entry, and evaluates low stock for affected products. Duplicate or unknown product IDs are rejected.
      operationId: putSupplierProducts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierProducts'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierProducts'
      parameters:
      - $ref: '#/components/parameters/Id'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
      description: Zero-based page number.
    Size:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
      description: Requested page size. Values above 50 are capped at 50.
  schemas:
    MonitoringResponse:
      type: object
      required:
      - grafanaUrl
      - enabled
      properties:
        grafanaUrl:
          type: string
          format: uri
          nullable: true
          description: Absolute HTTP or HTTPS Grafana URL without embedded credentials; null when disabled.
        enabled:
          type: boolean
          description: Whether a valid Grafana URL is configured.
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: At most 72 UTF-8 bytes; the character limit alone does not guarantee the byte limit.
    LoginResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: JWT access token. Default lifetime is 60 minutes, configured by jwt.expiration
            in milliseconds; read the exp claim for this token.
    ProductCreateRequest:
      type: object
      required:
      - sku
      - name
      - unitPrice
      - reorderLevel
      - warehouseId
      properties:
        sku:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        warehouseId:
          type: string
          format: uuid
          description: Existing warehouse that owns this product's stock balance. Required for new products.
        unitPrice:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        reorderLevel:
          type: integer
          format: int32
          minimum: 0
        isActive:
          type: boolean
          default: true
    ProductAdjustRequest:
      type: object
      required:
      - quantityAdjustment
      - reasonCode
      properties:
        quantityAdjustment:
          type: integer
          format: int32
          description: Signed change in units. The resulting stock must be between zero and 2147483647.
        reasonCode:
          type: string
          enum:
          - CYCLIC_COUNT_DISCREPANCY
          - DAMAGED_GOODS_SCRAP
          - SUPPLIER_SHORTAGE
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        categoryName:
          type: string
          nullable: true
        unitPrice:
          type: number
        stockQuantity:
          type: integer
          format: int32
        reorderLevel:
          type: integer
          format: int32
        warehouseId:
          type: string
          format: uuid
          nullable: true
        warehouseName:
          type: string
          nullable: true
        lowStockIndicator:
          type: boolean
        isActive:
          type: boolean
    OrderCreateRequest:
      type: object
      required:
      - supplierId
      - warehouseId
      - items
      properties:
        supplierId:
          type: string
          format: uuid
          description: Must identify an active supplier.
        warehouseId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
          minItems: 1
          maxItems: 500
          description: Each product may appear only once, must be active, and must be assigned to the
            order warehouse. Prices come from the server. The order total cannot exceed 9999999999.99.
    OrderItemRequest:
      type: object
      required:
      - productId
      - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    OrderStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_APPROVAL
      - APPROVED
      - SHIPPED
      - DELIVERED
