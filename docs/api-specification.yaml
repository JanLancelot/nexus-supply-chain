          format: int64
  responses:
    '400':
      description: Invalid request or disallowed state transition. Malformed transport input may use Spring’s
        standard error body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    '401':
      description: Missing, expired, invalid, or revoked credentials. Login returns ApiError; authentication
        filters may return an empty or framework error body.
    '403':
      description: Authenticated user lacks permission. Service errors use ApiError; security-filter rejections
        may use a framework error body.
    '404':
      description: Referenced resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
